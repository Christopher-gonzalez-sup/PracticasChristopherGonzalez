<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 id="puntaje">0</h1>

 
    <button onclick ="Agregar ()"> Agregar (1) puntos</button>
    <button onclick =" Duplicar ()" >Duplicar puntos </button>

<script>
let puntos = 0;
let marcador = document.getElementById ("puntaje")


function Agregar() {
    puntos += 1
    marcador.innerText = puntos;
}

function Duplicar() {
    puntos *=puntos * 2;
    marcador.innerText = puntos;
}

</script>

</body>
</html>
